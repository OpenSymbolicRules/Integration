name: Converter Drift Check

on:
  push:
    paths:
      - 'converter/**'
      - 'scripts/check_show_steps.py'
      - 'vendor/Rubi/**'
      - 'rules/**'
      - 'tests/**'
      - 'Specification/**'
      - '.github/workflows/converter-drift.yml'
  pull_request:
    paths:
      - 'converter/**'
      - 'scripts/check_show_steps.py'
      - 'vendor/Rubi/**'
      - 'rules/**'
      - 'tests/**'
      - 'Specification/**'
      - '.github/workflows/converter-drift.yml'
  workflow_dispatch:

jobs:
  drift-check:
    name: Verify converter output matches committed files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1.13"

      - name: Install converter dependencies
        run: julia --project=converter -e 'using Pkg; Pkg.instantiate()'

      - name: Test converter
        run: julia --project=converter converter/test/runtests.jl

      - name: Reproduce recovered RUBI sections
        run: |
          julia --project=converter converter/scripts/recover-profile.jl vendor/Rubi "$RUNNER_TEMP/recovered"
          python3 scripts/test_recovered_profile.py --compare "$RUNNER_TEMP/recovered"

      - name: Verify the default manifest against the pinned source
        run: |
          julia --project=converter converter/test/source_edition.jl
          python3 -m unittest discover -s scripts -p test_merge_source_edition.py
          julia --project=converter converter/scripts/source-edition.jl vendor/Rubi "$RUNNER_TEMP/source-edition"
          python3 scripts/merge_source_edition.py "$RUNNER_TEMP/source-edition/rules" "$RUNNER_TEMP/expanded"
          python3 scripts/check_show_steps.py vendor/Rubi "$RUNNER_TEMP/source-edition" rules
          python3 scripts/check_expanded_profile.py "$RUNNER_TEMP/expanded" rules

      - name: Re-run converter (tests)
        run: julia --project=converter converter/scripts/convert.jl --tests

      - name: Check for drift
        run: |
          if git diff --exit-code rules/ tests/; then
            echo "No drift detected — converter output matches committed files."
          else
            echo "::error::Converter drift detected! Re-run the converter and commit the updated output."
            echo ""
            echo "Changed files:"
            git diff --stat rules/ tests/
            exit 1
          fi

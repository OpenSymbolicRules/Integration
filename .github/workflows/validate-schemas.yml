name: Validate JSON Schemas

on:
  push:
    paths:
      - 'rules/**/*.json'
      - 'tests/**/*.json'
      - 'schemas/**/*.json'
      - 'Specification/**'
      - '.github/workflows/validate-schemas.yml'
  pull_request:
    paths:
      - 'rules/**/*.json'
      - 'tests/**/*.json'
      - 'schemas/**/*.json'
      - 'Specification/**'
      - '.github/workflows/validate-schemas.yml'

jobs:
  validate:
    name: JSON Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install check-jsonschema
        run: python -m pip install check-jsonschema==0.38.0

      - name: Validate schemas against meta-schema
        run: check-jsonschema --check-metaschema Specification/schemas/*.schema.json

      - name: Validate meta.json
        run: check-jsonschema --schemafile Specification/schemas/meta.schema.json rules/meta.json

      - name: Validate rule files
        run: |
          RULE_FILES=$(find rules/ -name '*.json' ! -name 'meta.json')
          if [ -n "$RULE_FILES" ]; then
            check-jsonschema \
              --schemafile Specification/schemas/rule-file.schema.json \
              --base-uri "file://${PWD}/Specification/schemas/" \
              $RULE_FILES
          else
            echo "No rule files found to validate"
          fi

      - name: Validate test files
        run: |
          TEST_FILES=$(find tests/ -name '*.json')
          if [ -n "$TEST_FILES" ]; then
            check-jsonschema \
              --schemafile Specification/schemas/test-file.schema.json \
              --base-uri "file://${PWD}/Specification/schemas/" \
              $TEST_FILES
          else
            echo "No test files found to validate"
          fi

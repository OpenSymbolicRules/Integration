name: Validate JSON Schemas

on:
  push:
    paths:
      - 'v1/**'
      - 'rules/**/*.json'
      - 'tests/**/*.json'
      - 'schemas/**/*.json'
      - 'Specification/**'
      - 'scripts/**'
      - '.github/workflows/validate-schemas.yml'
  pull_request:
    paths:
      - 'v1/**'
      - 'rules/**/*.json'
      - 'tests/**/*.json'
      - 'schemas/**/*.json'
      - 'Specification/**'
      - 'scripts/**'
      - '.github/workflows/validate-schemas.yml'

jobs:
  validate:
    name: JSON Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install check-jsonschema
        run: python -m pip install check-jsonschema==0.38.0

      - name: Validate schemas against meta-schema
        run: check-jsonschema --check-metaschema Specification/schemas/*.schema.json

      - name: Validate meta.json
        run: check-jsonschema --schemafile Specification/schemas/meta.schema.json rules/meta.json

      - name: Validate rule files
        run: |
          find rules/ -name '*.json' ! -name 'meta.json' -print0 | \
            xargs -0 -r -n 10 -P 4 check-jsonschema \
              --schemafile Specification/schemas/rule-file.schema.json \
              --base-uri "file://${PWD}/Specification/schemas/"

      - name: Validate test files
        run: |
          find tests/ -name '*.json' -print0 | \
            xargs -0 -r -n 10 -P 4 check-jsonschema \
              --schemafile Specification/schemas/test-file.schema.json \
              --base-uri "file://${PWD}/Specification/schemas/"

      - name: Validate globally unique rule identities
        run: python3 scripts/validate_rule_identities.py rules

      - name: Validate OpenMath semantic closure
        run: python3 Specification/scripts/validate_semantic_closure.py rules

      - name: Test exact duplicate-rule guard
        run: python3 scripts/test_check_duplicate_rules.py

      - name: Validate acknowledged exact duplicate rules
        run: python3 scripts/check_duplicate_rules.py rules --baseline scripts/duplicate-rule-baseline.json

      - name: Test the inventory script
        run: python3 scripts/test_inventory_v1.py

  v1:
    name: Check generated OSR v1 files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: OpenSymbolicRules/Verification
          ref: ab67266d2259c509a648696032486ad23febc6a8
          path: verification
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install check-jsonschema==0.38.0
      - run: scripts/check-v1.sh "verification/reports/$(python3 -c 'import json; print(json.load(open("v1/integration.report.json"))["build"]["source_digest"].removeprefix("sha256:"))')"
